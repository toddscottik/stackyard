[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/engine",
    "crates/cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-util", "time", "net", "sync"] }
sha2 = "0.10.9"
hex = "0.4.3"
zip = "2.4.2"
tar = "0.4.44"
flate2 = "1.1.2"
ureq = "2.12.1"
localdev-core = { path = "crates/core" }
localdev-engine = { path = "crates/engine" }
