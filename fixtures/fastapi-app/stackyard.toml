schema = 1
name = "fastapi-app"
manager = "pip"

[[service]]
id = "web"
runtime = "python"
command = ["python", "-m", "uvicorn", "app:app", "--host", "127.0.0.1", "--port", "{port}", "--reload"]
working_directory = "."
ready_path = "/"
ready_timeout_secs = 20
port = 0
restart = "on-failure"
restart_max = 2

[site]
service = "web"
host = "fastapi-app.localhost"
