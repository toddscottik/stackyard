schema = 2
name = "__STACKYARD_NAME__"

[[scope]]
id = "app"
directory = "."
runtime = "python"
manager = "pip"
lockfile_root = "."
environment = "managed"

[[service]]
id = "web"
scope = "app"
command = ["python", "-m", "flask", "--app", "app", "run", "--debug", "--host", "127.0.0.1", "--port", "{port}"]
working_directory = "."
endpoint = { protocol = "http", port = "auto" }
readiness = { kind = "http", path = "/", statuses = [200], timeout_secs = 30 }
