[package]
name = "stackyard-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "stackyard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
stackyard-core = { path = "../../../crates/core" }
serde.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon"] }
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSResponder", "NSWindow"] }

[dev-dependencies]
serde_json.workspace = true
